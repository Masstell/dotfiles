# tmux config — kept to options tmux 3.2+ understands (Ubuntu 22.04 / Debian 12 and newer).
# Reload after editing: prefix + r

# Mouse: click to select panes/windows, drag borders to resize, wheel scrolls
# into copy mode. Hold Shift to bypass tmux and use the terminal's own selection.
set -g mouse on

# Bigger scrollback; windows and panes count from 1 to match the keyboard
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# No lag on Esc (vim), keep focus events for vim's autoread, show messages longer
set -sg escape-time 10
set -g focus-events on
set -g display-time 2000

# Colors: 256-color + truecolor passthrough
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Copying lands in the local clipboard over SSH (OSC 52), if the terminal allows it
set -s set-clipboard on

# vi keys in copy mode: v to start, y to yank, C-v for block selection
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
# Keep the view put after a mouse drag-select instead of jumping to the bottom
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-no-clear

# Splits and new windows open in the current directory; | and - are easier to remember
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# Status bar: hostname on the left so it's obvious which box you're in
set -g status-interval 5
set -g status-style "bg=colour235,fg=colour250"
set -g status-left-length 30
set -g status-left "#[fg=colour235,bg=colour39,bold] #h #[default] "
set -g status-right "#[fg=colour245]#S  %H:%M "
setw -g window-status-current-style "fg=colour39,bold"
set -g pane-active-border-style "fg=colour39"
